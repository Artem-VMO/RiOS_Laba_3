openapi: 3.1.0
info:
  title: Payment Service API
  version: 1.0.0
  description: Интеграция с платежным шлюзом
servers:
  - url: http://payment-service:8080
paths:
  /api/v1/payments:
    post:
      tags: [public]
      summary: Инициировать платеж за пропуск
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passId, amount]
              properties:
                passId: { type: string, format: uuid }
                amount: { type: number, example: 1500.00 }
      responses:
        '201':
          description: Платеж создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
  /internal/v1/payments/callback:
    post:
      tags: [internal]
      summary: Коллбэк от банка о статусе платежа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transactionId: { type: string }
                status: { type: string, enum: [SUCCESS, FAIL] }
      responses:
        '200':
          description: Принято

components:
  schemas:
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED] }
        paymentUrl: { type: string, format: uri }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    PaymentCompletedEvent:
      type: object
      description: Событие успешной оплаты
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string, example: "payment.completed" }
        schemaVersion: { type: integer, example: 1 }
        occurredAt: { type: string, format: date-time }
        payload:
          type: object
          properties:
            paymentId: { type: string, format: uuid }
            passId: { type: string, format: uuid }
            amount: { type: number }
            currency: { type: string }